<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>レトロ10円玉ゲーム</title>
    <style>
        body { margin: 0; background: #353b48; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #f5f6fa; font-family: sans-serif; touch-action: none; }
        canvas { background: #dcdde1; border: 8px solid #57606f; border-radius: 4px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #ui { margin-top: 10px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div id="ui">所持金: <span id="money">50</span>円 / ハイスコア: <span id="high">50</span>円</div>
    <canvas id="gameCanvas" width="300" height="400"></canvas>
    <div id="msg">下の10円を引っ張って発射！</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let money = 50, high = localStorage.getItem('retro_high') || 50;
        let coin = {x: 150, y: 350, r: 10, vx: 0, vy: 0, moving: false, dragging: false};

        // 得点ポケット
        const holes = [
            {x: 70, y: 80, r: 18, pts: 50, color: '#e84118'},
            {x: 150, y: 50, r: 20, pts: 100, color: '#fbc531'},
            {x: 230, y: 80, r: 18, pts: 50, color: '#e84118'},
            {x: 150, y: 150, r: 15, pts: 20, color: '#487eb0'}
        ];

        canvas.addEventListener('pointerdown', (e) => {
            if(coin.moving || money < 10) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            if(Math.hypot(x - coin.x, y - coin.y) < 40) coin.dragging = true;
        });

        canvas.addEventListener('pointermove', (e) => {
            if(!coin.dragging) return;
            const rect = canvas.getBoundingClientRect();
            coin.y = Math.max(300, Math.min(380, (e.clientY || e.touches[0].clientY) - rect.top));
        });

        canvas.addEventListener('pointerup', () => {
            if(!coin.dragging) return;
            coin.dragging = false;
            money -= 10;
            coin.vx = (Math.random() - 0.5) * 4;
            coin.vy = -(350 - coin.y) * 0.4 - 5;
            coin.moving = true;
        });

        function update() {
            if(coin.moving) {
                coin.x += coin.vx; coin.y += coin.vy; coin.vy += 0.25;
                if(coin.x < 15 || coin.x > 285) coin.vx *= -0.7;
                
                holes.forEach(h => {
                    if(Math.hypot(coin.x - h.x, coin.y - h.y) < h.r) {
                        money += h.pts;
                        if(money > high) { high = money; localStorage.setItem('retro_high', high); }
                        reset();
                    }
                });
                if(coin.y > 410) reset();
            }
            draw();
            requestAnimationFrame(update);
        }

        function reset() {
            coin = {x: 150, y: 350, r: 10, vx: 0, vy: 0, moving: false, dragging: false};
            document.getElementById('money').innerText = money;
            document.getElementById('high').innerText = high;
            if(money < 10) { money = 50; document.getElementById('msg').innerText = "お小遣い支給！"; }
        }

        function draw() {
            ctx.fillStyle = '#f5f6fa'; ctx.fillRect(0,0,300,400);
            holes.forEach(h => {
                ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI*2);
                ctx.fillStyle = h.color; ctx.fill();
                ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(h.pts, h.x, h.y+3);
            });
            ctx.beginPath(); ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI*2);
            ctx.fillStyle = '#fbc531'; ctx.fill(); ctx.stroke();
        }
        update();
    </script>
</body>
</html>
